# ivitals configuration. Zero CLI args: this file is the only input.
schema_version = 2

[global]
interval_secs = 5
process_interval_secs = 60
top_n_processes = 50
retention_days = 30
data_dir = "data"
log_level = "info"

[extras]
cpu_detail = true
memory_detail = true
disk_io = true
net = true
gpu_detail = "auto"
slurm = "auto"
fs_space = true

# Remote servers use literal hosts (resolved from ~/.ssh/config on
# 2026-11-17) so ivitals runs on machines without the same ssh config.
# Aliases still work if present; an explicit ssh_port always wins over
# a Port line in ~/.ssh/config. Note: the 10.16.x.x LAN IPs are only
# reachable from within that network.

[[servers]]
alias = "sustech"
mode = "remote"
ssh_host = "10.16.122.147"
ssh_user = "iydon"
connect_timeout_secs = 5
exec_timeout_secs = 15

[[servers]]
alias = "sinotruk"
mode = "remote"
ssh_host = "frp.iydon.top"
ssh_user = "sinotruk"
ssh_port = 7105
connect_timeout_secs = 5
exec_timeout_secs = 15

[[servers]]
alias = "valadu"
mode = "remote"
ssh_host = "10.25.179.122"
ssh_user = "iydon"
connect_timeout_secs = 5
exec_timeout_secs = 15

[[servers]]
alias = "frp"
mode = "remote"
ssh_host = "frp.iydon.top"
ssh_user = "root"
connect_timeout_secs = 5
exec_timeout_secs = 15

[[servers]]
alias = "data"
mode = "remote"
ssh_host = "data.iydon.top"
ssh_user = "data"
connect_timeout_secs = 5
exec_timeout_secs = 15

[[servers]]
alias = "local"
mode = "local"
